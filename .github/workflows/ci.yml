name: Synthetic analysis and validation
on: [push, pull_request, workflow_dispatch]
jobs:
  synthetic:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
      - uses: r-lib/actions/setup-renv@v2
      - name: Run all synthetic stages
        run: Rscript run_pipeline.R --config config/analysis_settings.yml
      - name: Check invariants and failure gates
        run: Rscript tests/run_tests.R
